name: Poker game checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Download pinned Godot release
        run: |
          curl --fail -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.5.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
      - name: Import game assets
        run: /tmp/godot/godot --headless --path game --editor --import --quit
      - name: Play complete hands through Godot and the API
        run: |
          python -m uvicorn app.main:app --app-dir backend --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/api/health
          timeout 90 /tmp/godot/godot --headless --path game -- --smoke
          timeout 90 /tmp/godot/godot --headless --path game -- --smoke-fold
